[tool.coverage.run]
source = ["skills_app"]
omit = ["*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "if __name__ == .__main__",
    "raise NotImplementedError",
    "pass",
    "except ImportError",
]
show_missing = true
precision = 1
# Estate baseline+ratchet default (docs/standards/pipeline-testing.md §4.2),
# not the template's own 100% special case — this is a new app, not the
# reference every other aw-app-* is measured against.
fail_under = 80
