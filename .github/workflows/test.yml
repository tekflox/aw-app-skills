name: Test

# Push/PR-triggered coverage gate: pytest-cov against pyproject.toml's
# fail_under=80 (estate baseline+ratchet default, docs/standards/
# pipeline-testing.md §4.2), blocking.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch: {}

# runs-on is derived from this repo's owner, same reasoning as aw-app-template's:
#   1. The [self-hosted, aw-baremetal] runners live in tekflox org runner group
#      3 (aw-private), shareable only with repos inside that org.
#   2. The unqualified `pull_request:` trigger is safe only on GitHub-hosted
#      runners (disposable VMs, read-only token) — never on self-hosted.
jobs:
  coverage:
    runs-on: ${{ fromJSON(startsWith(github.repository, 'tekflox/') && '["self-hosted","aw-baremetal"]' || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements-dev.txt pytest jsonschema fastapi httpx uvicorn
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: tekflox/aw-marketplace
          path: .aw-marketplace-schema
      - name: Validate manifest
        run: python3 tests/validate_manifest.py aw-app.json --schema .aw-marketplace-schema/schemas/aw-app.schema.json
      - name: Test suite + coverage gate
        run: |
          pytest --cov=skills_app --cov-report=term-missing \
            --cov-report=html --cov-report=xml tests/ -q
      - name: Upload coverage report artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: |
            htmlcov/
            coverage.xml
          retention-days: 30
