name: Release
#
# Works on a personal-account repo as well as a tekflox/* one, with no edit
# here. The called workflow derives `runs-on` from the CALLER's owner —
# `tekflox/*` gets the org's [self-hosted, aw-baremetal] pair, anything else
# gets ubuntu-latest.

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      bump:
        description: "Force bump kind"
        type: choice
        options: [major]

jobs:
  release:
    permissions:
      contents: write
    uses: tekflox/aw-marketplace/.github/workflows/app-release.yml@master
    with:
      bump: ${{ inputs.bump || '' }}
    secrets:
      MARKETPLACE_SYNC_TOKEN: ${{ secrets.MARKETPLACE_SYNC_TOKEN }}
